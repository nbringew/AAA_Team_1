description = "Quarto template for IS3 team project reports" # REPLACE
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ipykernel>=6.20.0",
    "pyyaml>=6.0.0",
    "jupyter>=1.0.0",
    "sodapy>=2.2.0",
    "requests>=2.33.1",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=24.0.0",
    "h3>=4.5.0",
    "contextily>=1.7.0",
    "scikit-learn>=1.9.0",
    "holidays>=0.100",
    "torch>=2.13.0",
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.9.0",
    "scipy>=1.17.1",
