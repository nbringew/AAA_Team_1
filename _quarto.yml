project:
  type: default
  output-dir: docs

execute:
  daemon: 0

format:
  pdf:
    documentclass: scrartcl
    geometry:
      - left=2.5cm
      - right=2.5cm
      - top=2.5cm
      - bottom=2.5cm
    setspace:
      linestretch: 1.5
    template-partials:
      - partials/before-body.tex
    include-in-header:
      - partials/header.tex
    cite-method: biblatex
    biblio-style: apa
    # The front matter (abstract, then contents/figures/tables/equations) is
    # emitted manually at the top of report.qmd so the abstract can sit directly
    # after the title page; the template must not insert its own toc/lof/lot.
    toc: false
    lof: false
    lot: false
    number-sections: true
    execute:
      echo: false
      warning: false
  # html:
  #   toc: true
  #   number-sections: true
  #   code-fold: true
  #   execute:
  #     echo: true
  #     warning: false
  #   embed-resources: true

bibliography: references.bib
